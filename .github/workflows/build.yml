name: Build JET VPN TV

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Ensure Flutter Android project
        run: |
          set -e
          if [ ! -d android ]; then
            mkdir -p /tmp/jet-tv-keep
            cp -f pubspec.yaml /tmp/jet-tv-keep/ || true
            cp -f lib/main.dart /tmp/jet-tv-keep/ || true
            cp -f patch_tv.py /tmp/jet-tv-keep/ || true
            cp -f patch_signing.py /tmp/jet-tv-keep/ || true
            cp -f logotype.png /tmp/jet-tv-keep/ || true
            cp -f start.mp4 /tmp/jet-tv-keep/ || true
            flutter create . --project-name jet_vpn_tv --org com.jetconfig.vpntv --platforms=android
            cp -f /tmp/jet-tv-keep/pubspec.yaml . || true
            mkdir -p lib
            cp -f /tmp/jet-tv-keep/main.dart lib/main.dart || true
            cp -f /tmp/jet-tv-keep/patch_tv.py . || true
            cp -f /tmp/jet-tv-keep/patch_signing.py . || true
            cp -f /tmp/jet-tv-keep/logotype.png . || true
            cp -f /tmp/jet-tv-keep/start.mp4 . || true
          fi
          test -f lib/main.dart
          test -f pubspec.yaml

      - name: Ensure splash video asset
        run: |
          set -e
          if [ -f start.mp4 ] && [ -s start.mp4 ]; then
            echo "start.mp4 found ($(wc -c < start.mp4) bytes)"
          else
            echo "start.mp4 missing — creating short H.264 placeholder so build does not fail"
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            ffmpeg -y -f lavfi -i color=c=black:s=1280x720:d=2 \
              -f lavfi -i anullsrc=r=44100:cl=stereo \
              -c:v libx264 -pix_fmt yuv420p -t 2 -c:a aac -shortest start.mp4
            ls -lh start.mp4
          fi
          # logotype اختیاری
          if [ ! -f logotype.png ]; then
            echo "logotype.png missing — creating 1x1 placeholder"
            python3 -c "import struct,zlib; open('logotype.png','wb').write(bytes.fromhex('89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000a49444154789c63000100000500010d0a2db40000000049454e44ae426082'))"
          fi

      - name: Patch Android for TV
        run: python3 patch_tv.py

      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ]; then
            echo "signing: secrets empty → build WITHOUT release signing"
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android/app/jetconfig-release.jks
          if [ ! -s android/app/jetconfig-release.jks ]; then
            echo "signing: base64 decode empty → skip signing"
            rm -f android/app/jetconfig-release.jks
            exit 0
          fi

          if ! keytool -list -keystore android/app/jetconfig-release.jks \
              -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/tmp/kt.out 2>/tmp/kt.err; then
            echo "signing: KEYSTORE/PASSWORD/ALIAS invalid → skip signing (build continues unsigned)"
            echo "--- keytool stderr ---"
            cat /tmp/kt.err || true
            rm -f android/app/jetconfig-release.jks
            exit 0
          fi

          printf '%s\n' \
            "storePassword=$STORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "storeFile=jetconfig-release.jks" \
            > android/key.properties
          python3 patch_signing.py
          echo "signing: OK — release will be signed"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK split by ABI
        run: |
          set -e
          flutter build apk --release --split-per-abi
          ls -lh build/app/outputs/flutter-apk/ || true

      - name: Prepare release files
        run: |
          set -e
          mkdir -p release-files
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-files/JET-VPN-TV-arm64.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-files/JET-VPN-TV-arm32.apk
          fi
          ls -lh release-files/

      - name: Upload arm64 APK
        if: hashFiles('release-files/JET-VPN-TV-arm64.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: JET-VPN-TV-arm64
          path: release-files/JET-VPN-TV-arm64.apk
          if-no-files-found: warn

      - name: Upload arm32 APK
        if: hashFiles('release-files/JET-VPN-TV-arm32.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: JET-VPN-TV-arm32
          path: release-files/JET-VPN-TV-arm32.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-1.0.12-${{ github.run_number }}
          name: JET VPN TV ${{ github.run_number }}
          files: |
            release-files/JET-VPN-TV-arm64.apk
            release-files/JET-VPN-TV-arm32.apk
          fail_on_unmatched_files: false
          body: |
            ### نصب
            - JET-VPN-TV-arm32.apk (برای اکثر تی‌وی‌ها)
            - JET-VPN-TV-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
