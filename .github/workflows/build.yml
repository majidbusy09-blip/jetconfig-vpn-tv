name: Build JET VPN TV

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Ensure Flutter Android project
        run: |
          set -e
          if [ ! -d android ]; then
            mkdir -p /tmp/jet-tv-keep
            cp -f pubspec.yaml /tmp/jet-tv-keep/ || true
            cp -f lib/main.dart /tmp/jet-tv-keep/ || true
            cp -f patch_tv.py /tmp/jet-tv-keep/ || true
            flutter create . --project-name jet_vpn_tv --org com.jetconfig.vpntv --platforms=android
            cp -f /tmp/jet-tv-keep/pubspec.yaml . || true
            mkdir -p lib
            cp -f /tmp/jet-tv-keep/main.dart lib/main.dart || true
            cp -f /tmp/jet-tv-keep/patch_tv.py . || true
          fi
          test -f lib/main.dart
          test -f pubspec.yaml
          test -f patch_tv.py

      - name: Patch Android for TV
        run: python3 patch_tv.py

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JET-VPN-TV
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-1.0.0-${{ github.run_number }}
          name: JET VPN TV ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
