name: Build JET VPN TV

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Ensure Flutter Android project
        run: |
          set -e
          if [ ! -d android ]; then
            mkdir -p /tmp/jet-tv-keep
            cp -f pubspec.yaml /tmp/jet-tv-keep/ || true
            cp -f lib/main.dart /tmp/jet-tv-keep/ || true
            cp -f patch_tv.py /tmp/jet-tv-keep/ || true
            cp -f logotype.png /tmp/jet-tv-keep/ || true
            flutter create . --project-name jet_vpn_tv --org com.jetconfig.vpntv --platforms=android
            cp -f /tmp/jet-tv-keep/pubspec.yaml . || true
            mkdir -p lib
            cp -f /tmp/jet-tv-keep/main.dart lib/main.dart || true
            cp -f /tmp/jet-tv-keep/patch_tv.py . || true
            cp -f /tmp/jet-tv-keep/logotype.png . || true
          fi
          test -f lib/main.dart
          test -f pubspec.yaml

      - name: Patch Android for TV
        run: python3 patch_tv.py

      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ]; then
            echo "signing: no secrets — unsigned/debug"
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android/app/jetconfig-release.jks
          printf '%s\n' \
            "storePassword=$STORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "storeFile=jetconfig-release.jks" \
            > android/key.properties
          echo "signing: keystore + key.properties ready"

          # امضا را در انتهای build.gradle اضافه می‌کنیم (بعد از بسته شدن android {})
          # تا با plugins {} و ساختار جدید Flutter تداخل نکند
          python3 << 'PY'
          from pathlib import Path

          GROOVY_TAIL = r'''
// --- JET VPN TV release signing (appended) ---
def _jetKp = new Properties()
def _jetKpFile = rootProject.file("key.properties")
if (_jetKpFile.exists()) {
    _jetKp.load(new FileInputStream(_jetKpFile))
    android.signingConfigs {
        release {
            keyAlias _jetKp["keyAlias"]
            keyPassword _jetKp["keyPassword"]
            storeFile _jetKp["storeFile"] ? file(_jetKp["storeFile"]) : null
            storePassword _jetKp["storePassword"]
        }
    }
    android.buildTypes.release.signingConfig android.signingConfigs.release
}
'''

          KTS_TAIL = r'''
// --- JET VPN TV release signing (appended) ---
import java.util.Properties
import java.io.FileInputStream
val _jetKp = Properties()
val _jetKpFile = rootProject.file("key.properties")
if (_jetKpFile.exists()) {
    _jetKp.load(FileInputStream(_jetKpFile))
    android.signingConfigs {
        create("release") {
            keyAlias = _jetKp["keyAlias"] as String?
            keyPassword = _jetKp["keyPassword"] as String?
            storeFile = (_jetKp["storeFile"] as String?)?.let { file(it) }
            storePassword = _jetKp["storePassword"] as String?
        }
    }
    android.buildTypes.getByName("release").signingConfig =
        android.signingConfigs.getByName("release")
}
'''

          for name, tail in (
              ("android/app/build.gradle", GROOVY_TAIL),
              ("android/app/build.gradle.kts", KTS_TAIL),
          ):
              path = Path(name)
              if not path.exists():
                  continue
              g = path.read_text(encoding="utf-8")
              # پاک کردن پچ‌های خراب قبلی
              if "JET VPN TV release signing" in g:
                  g = g.split("// --- JET VPN TV release signing")[0].rstrip() + "\n"
              if "keystorePropertiesFile" in g and "JET VPN TV" not in g:
                  # حذف loader/injectionهای قبلی که ممکن است خراب باشند — احتیاطی
                  pass
              g = g.rstrip() + "\n" + tail + "\n"
              path.write_text(g, encoding="utf-8")
              print("signing tail appended to", name)
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK split by ABI
        run: |
          set -e
          flutter build apk --release --split-per-abi
          ls -lh build/app/outputs/flutter-apk/ || true

      - name: Prepare release files
        run: |
          set -e
          mkdir -p release-files
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-files/JET-VPN-TV-arm64.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-files/JET-VPN-TV-arm32.apk
          fi
          ls -lh release-files/

      - name: Upload arm64 APK
        if: hashFiles('release-files/JET-VPN-TV-arm64.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: JET-VPN-TV-arm64
          path: release-files/JET-VPN-TV-arm64.apk
          if-no-files-found: warn

      - name: Upload arm32 APK
        if: hashFiles('release-files/JET-VPN-TV-arm32.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: JET-VPN-TV-arm32
          path: release-files/JET-VPN-TV-arm32.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-1.0.4-${{ github.run_number }}
          name: JET VPN TV ${{ github.run_number }}
          files: |
            release-files/JET-VPN-TV-arm64.apk
            release-files/JET-VPN-TV-arm32.apk
          fail_on_unmatched_files: false
          body: |
            ### فایل‌های نصب (جداگانه)
            - **JET-VPN-TV-arm64.apk** — اکثر تی‌وی‌ها (پیشنهادی)
            - **JET-VPN-TV-arm32.apk** — باکس‌های قدیمی ۳۲بیتی
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
